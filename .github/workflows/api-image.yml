name: Imagem isolada da API
on:
  push:
    branches: [main]
    paths: ['services/api/**', 'contracts/generated/**', 'tools/image_ci.py', 'tools/test_image_ci.py', '.github/workflows/api-image.yml']
  pull_request:
    paths: ['services/api/**', 'contracts/generated/**', 'tools/image_ci.py', 'tools/test_image_ci.py', '.github/workflows/api-image.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Conferir barreiras antes do Docker
        run: python -m unittest discover -s tools -p test_image_ci.py
      - name: Construir e avaliar sem dados ou rede externa do container
        env:
          TF_IMAGE_CI: '1'
        run: python tools/image_ci.py
      - name: Guardar imagem e metadados por sete dias
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: api-image-${{ github.sha }}
          path: ${{ runner.temp }}/api-image-artifact/
          if-no-files-found: warn
          retention-days: 7
