name: Integração SQL descartável

on:
  push:
    branches: [main]
    paths: ['services/api/**', 'tools/db_permissions.py', 'tools/sql_ci.py', 'tools/test_sql_ci.py', '.github/workflows/sql.yml']
  pull_request:
    paths: ['services/api/**', 'tools/db_permissions.py', 'tools/sql_ci.py', 'tools/test_sql_ci.py', '.github/workflows/sql.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  meal-privacy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        # Imagem oficial17.5, paridade com a avaliação local; digest conferido.
        image: postgres:17.5@sha256:aadf2c0696f5ef357aa7a68da995137f0cf17bad0bf6e1f17de06ae5c769b302
        env:
          POSTGRES_USER: trainforge_ci_bootstrap
          POSTGRES_PASSWORD: ci-only-ephemeral-postgres17
          POSTGRES_DB: postgres
        ports: ['15432:5432']
        options: >-
          --health-cmd "pg_isready -U trainforge_ci_bootstrap -d postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: services/api/go.mod
          cache-dependency-path: services/api/go.sum
      - name: Validar barreiras antes de conectar
        run: python -m unittest discover -s tools -p test_sql_ci.py
      - name: Migrations, rerun e integração SQL/HTTP de refeições e privacidade
        env:
          TF_SQL_CI: '1'
          TF_CI_PG_PASSWORD: ci-only-ephemeral-postgres17
        run: python tools/sql_ci.py
