name: Segredos no histórico Git

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: secrets-${{ github.ref }}
  cancel-in-progress: true

jobs:
  git-history:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Preparar scanner oficial por digest
        run: |
          set -euo pipefail
          target="$RUNNER_TEMP/trainforge-secret-scanner"
          mkdir -p "$target"
          curl --fail --location --proto '=https' --tlsv1.2 --max-time 120 --retry 2 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            -o "$target/scanner.tar.gz"
          printf '%s  %s\n' '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' "$target/scanner.tar.gz" | sha256sum -c -
          tar -xzf "$target/scanner.tar.gz" -C "$target" gitleaks
          test "$("$target/gitleaks" version)" = '8.30.1'
      - name: Testar sanitização do relatório
        run: python -m unittest discover -s tools -p test_secret_ci.py
      - name: Verificar redaction com fixture isolada e analisar histórico
        run: python tools/secret_ci.py --binary "$RUNNER_TEMP/trainforge-secret-scanner/gitleaks"
      - name: Publicar somente metadados sanitizados
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: git-secret-metadata-${{ github.sha }}
          path: ${{ runner.temp }}/git-secret-report/safe-report.json
          if-no-files-found: warn
          retention-days: 7
