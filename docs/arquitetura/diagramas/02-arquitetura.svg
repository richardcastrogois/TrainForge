<svg xmlns="http://www.w3.org/2000/svg" width="1230" height="1198" viewBox="0 0 1230 1198" role="img">
<title>Quem conversa com quem</title>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs>
<rect width="1230" height="1198" fill="#ffffff"/>
<g font-family="Inter,Arial,sans-serif" fill="#18332e">
<text x="40" y="60" font-size="18" font-weight="700">Quem conversa com quem</text>
<text x="40" y="100" font-size="15" font-weight="400">Código em integração: alimentação consulta SQLite e salva SQLCipher no aparelho; sync usa API própria. As bases PostgreSQL</text>
<text x="40" y="120" font-size="15" font-weight="400">usam o mesmo cluster local15432. Ativação/global e Android têm gates no handoff.</text>
<path d="M390,280 L450,280" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M780,280 L840,280" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M615,370 L615,415.0 L615,415.0 L615,460" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M1005,370 L1005,415.0 L1005,415.0 L1005,460" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M225,370 L225,415.0 L225,415.0 L225,460" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M225,370 L225,550.0 L225,550.0 L225,730" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M225,370 L225,550.0 L615,550.0 L615,730" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M615,910 L615,550.0 L615,550.0 L615,190" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="60" y="190" width="330" height="180" rx="15" fill="#d5e8d4" stroke="#52734d"/>
<text x="78" y="216" font-size="12" font-weight="700">EXISTENTE</text>
<text x="78" y="244" font-size="18" font-weight="700">Flutter / Android</text>
<text x="78" y="292" font-size="15" font-weight="400">Interface móvel; busca alimentar</text>
<text x="78" y="310" font-size="15" font-weight="400">offline; demais jornadas usam a</text>
<text x="78" y="328" font-size="15" font-weight="400">API.</text>
<rect x="450" y="190" width="330" height="180" rx="15" fill="#d5e8d4" stroke="#52734d"/>
<text x="468" y="216" font-size="12" font-weight="700">EXISTENTE</text>
<text x="468" y="244" font-size="18" font-weight="700">API Go :8082</text>
<text x="468" y="292" font-size="15" font-weight="400">Autenticação, regras privadas e</text>
<text x="468" y="310" font-size="15" font-weight="400">composição dos serviços.</text>
<rect x="840" y="190" width="330" height="180" rx="15" fill="#d5e8d4" stroke="#52734d"/>
<text x="858" y="216" font-size="12" font-weight="700">EXISTENTE</text>
<text x="858" y="244" font-size="18" font-weight="700">Catálogo Go :18083</text>
<text x="858" y="292" font-size="15" font-weight="400">Leitura editorial separada; só</text>
<text x="858" y="310" font-size="15" font-weight="400">quatro tabelas públicas.</text>
<rect x="60" y="460" width="330" height="180" rx="15" fill="#e1d5e7" stroke="#756080"/>
<text x="78" y="486" font-size="12" font-weight="700">EXTERNO</text>
<text x="78" y="514" font-size="18" font-weight="700">Google OAuth</text>
<text x="78" y="562" font-size="15" font-weight="400">Pessoa escolhe conta; API verifica</text>
<text x="78" y="580" font-size="15" font-weight="400">identidade.</text>
<rect x="450" y="460" width="330" height="180" rx="15" fill="#d5e8d4" stroke="#52734d"/>
<text x="468" y="486" font-size="12" font-weight="700">EXISTENTE</text>
<text x="468" y="514" font-size="18" font-weight="700">Banco do núcleo</text>
<text x="468" y="562" font-size="15" font-weight="400">trainforge_v1_dev;</text>
<text x="468" y="580" font-size="15" font-weight="400">schema16/38tabelas. Ativação</text>
<text x="468" y="598" font-size="15" font-weight="400">preservou as30tabelas anteriores.</text>
<rect x="840" y="460" width="330" height="180" rx="15" fill="#d5e8d4" stroke="#52734d"/>
<text x="858" y="486" font-size="12" font-weight="700">EXISTENTE</text>
<text x="858" y="514" font-size="18" font-weight="700">Banco do catálogo</text>
<text x="858" y="562" font-size="15" font-weight="400">trainforge_catalog_dev;</text>
<text x="858" y="580" font-size="15" font-weight="400">schema2;4tabelas.</text>
<rect x="60" y="730" width="330" height="180" rx="15" fill="#fff2cc" stroke="#9c7b18"/>
<text x="78" y="756" font-size="12" font-weight="700">PARCIAL</text>
<text x="78" y="784" font-size="18" font-weight="700">SQLite público no aparelho</text>
<text x="78" y="832" font-size="15" font-weight="400">Catálogo gzip/Ed25519,</text>
<text x="78" y="850" font-size="15" font-weight="400">TACO+USDA+OFF+legados; GTIN e</text>
<text x="78" y="868" font-size="15" font-weight="400">porções. Pacote final em</text>
<text x="78" y="886" font-size="15" font-weight="400">preparação.</text>
<rect x="450" y="730" width="330" height="180" rx="15" fill="#fff2cc" stroke="#9c7b18"/>
<text x="468" y="756" font-size="12" font-weight="700">PARCIAL</text>
<text x="468" y="784" font-size="18" font-weight="700">SQLCipher por conta</text>
<text x="468" y="832" font-size="15" font-weight="400">Consumos, alimentos particulares,</text>
<text x="468" y="850" font-size="15" font-weight="400">fila, conflitos e fotos de rótulo;</text>
<text x="468" y="868" font-size="15" font-weight="400">chave no armazenamento seguro.</text>
<text x="40" y="950" font-size="16" font-weight="700">Conexões (mesma ordem do arquivo editável)</text>
<text x="40" y="978" font-size="14" font-weight="400">Flutter / Android → API Go :8082: HTTP/JSON local</text>
<text x="40" y="1004" font-size="14" font-weight="400">API Go :8082 → Catálogo Go :18083: HTTP interno</text>
<text x="40" y="1030" font-size="14" font-weight="400">API Go :8082 → Banco do núcleo: pgx / SQL</text>
<text x="40" y="1056" font-size="14" font-weight="400">Catálogo Go :18083 → Banco do catálogo: pgx / SQL</text>
<text x="40" y="1082" font-size="14" font-weight="400">Flutter / Android → Google OAuth: login consentido</text>
<text x="40" y="1108" font-size="14" font-weight="400">Flutter / Android → SQLite público no aparelho: consulta local/FTS4</text>
<text x="40" y="1134" font-size="14" font-weight="400">Flutter / Android → SQLCipher por conta: snapshot + operação durável</text>
<text x="40" y="1160" font-size="14" font-weight="400">SQLCipher por conta → API Go :8082: sync autenticada + revisão</text>
</g></svg>
