<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844"><rect x="0" y="0" width="390" height="844" rx="32" fill="#F6F6F1"/><text x="26" y="30" font-family="Inter,Segoe UI,sans-serif" font-size="12" font-weight="600" fill="#142F2C">9:41</text><rect x="24" y="51" width="34" height="34" rx="11" fill="#215E52"/><path d="M31 61 H45 M38 61 V77" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><path d="M44 77 V60 H51 M44 68 H50" fill="none" stroke="#D8EB90" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><text x="68" y="79" font-family="Inter,Segoe UI,sans-serif" font-size="24" font-weight="700" fill="#215E52">trainforge</text><text x="24" y="130" font-family="Inter,Segoe UI,sans-serif" font-size="26" font-weight="700" fill="#142F2C">O teu diário começa aqui.</text><text x="24" y="159" font-family="Inter,Segoe UI,sans-serif" font-size="11" font-weight="400" fill="#64736E">ALIMENTAÇÃO · CONFIGURAÇÃO PENDENTE</text><rect x="145" y="834" width="100" height="4" rx="2" fill="#142F2C"/><rect x="24" y="185" width="342" height="82" rx="20" fill="#E8EEE3"/><text x="42" y="214" font-family="Inter,Segoe UI,sans-serif" font-size="13" font-weight="650" fill="#215E52">Ainda não configuraste a alimentação</text><text x="42" y="239" font-family="Inter,Segoe UI,sans-serif" font-size="11" font-weight="400" fill="#64736E">Escolhe como queres usar o diário e quais</text><text x="42" y="255" font-family="Inter,Segoe UI,sans-serif" font-size="11" font-weight="400" fill="#64736E">refeições vais registar. Horários são opcionais.</text><text x="28" y="296" font-family="Inter,Segoe UI,sans-serif" font-size="11" font-weight="400" fill="#64736E">Não precisas de repetir os dados do treino.</text><text x="28" y="312" font-family="Inter,Segoe UI,sans-serif" font-size="11" font-weight="400" fill="#64736E">Sem meta calórica? Podes apenas registar refeições.</text><g><rect x="24" y="337" width="342" height="48" rx="16" fill="#215E52"/><text x="195" y="367" text-anchor="middle" font-family="Inter,Segoe UI,sans-serif" font-size="13" font-weight="600" fill="white">Configurar alimentação</text></g><g><text x="195" y="415" text-anchor="middle" font-family="Inter,Segoe UI,sans-serif" font-size="13" font-weight="600" fill="#215E52">Voltar a Hoje</text></g></svg>