<svg xmlns="http://www.w3.org/2000/svg" width="1230" height="1198" viewBox="0 0 1230 1198" role="img">
<title>Mapa das telas ativas</title>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs>
<rect width="1230" height="1198" fill="#ffffff"/>
<g font-family="Inter,Arial,sans-serif" fill="#18332e">
<text x="40" y="60" font-size="18" font-weight="700">Mapa das telas ativas</text>
<text x="40" y="100" font-size="15" font-weight="400">Setas são navegação, não chamadas SQL. Biblioteca e fontes públicas também podem ser acessadas antes do login.</text>
<path d="M390,280 L450,280" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M780,280 L840,280" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M615,370 L615,415.0 L225,415.0 L225,460" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M615,370 L615,415.0 L615,415.0 L615,460" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M780,550 L840,550" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M225,640 L225,685.0 L225,685.0 L225,730" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M225,640 L225,685.0 L615,685.0 L615,730" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M225,640 L225,685.0 L1005,685.0 L1005,730" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="60" y="190" width="330" height="180" rx="15" fill="#d5e8d4" stroke="#52734d"/>
<text x="78" y="216" font-size="12" font-weight="700">EXISTENTE</text>
<text x="78" y="244" font-size="18" font-weight="700">Inicialização / entrada</text>
<text x="78" y="292" font-size="15" font-weight="400">Restaura preferências e sessão;</text>
<text x="78" y="310" font-size="15" font-weight="400">login é manual.</text>
<rect x="450" y="190" width="330" height="180" rx="15" fill="#d5e8d4" stroke="#52734d"/>
<text x="468" y="216" font-size="12" font-weight="700">EXISTENTE</text>
<text x="468" y="244" font-size="18" font-weight="700">Hoje / ProductShell</text>
<text x="468" y="292" font-size="15" font-weight="400">Planos, atividade, alimentação e</text>
<text x="468" y="310" font-size="15" font-weight="400">evolução; indisponibilidade</text>
<text x="468" y="328" font-size="15" font-weight="400">explícita.</text>
<rect x="840" y="190" width="330" height="180" rx="15" fill="#d5e8d4" stroke="#52734d"/>
<text x="858" y="216" font-size="12" font-weight="700">EXISTENTE</text>
<text x="858" y="244" font-size="18" font-weight="700">Biblioteca</text>
<text x="858" y="292" font-size="15" font-weight="400">Lista → detalhe; conteúdo de treino</text>
<text x="858" y="310" font-size="15" font-weight="400">só para consulta.</text>
<rect x="60" y="460" width="330" height="180" rx="15" fill="#d5e8d4" stroke="#52734d"/>
<text x="78" y="486" font-size="12" font-weight="700">EXISTENTE</text>
<text x="78" y="514" font-size="18" font-weight="700">Seu espaço</text>
<text x="78" y="562" font-size="15" font-weight="400">Conta, configuração, preferências,</text>
<text x="78" y="580" font-size="15" font-weight="400">idioma e fontes.</text>
<rect x="450" y="460" width="330" height="180" rx="15" fill="#d5e8d4" stroke="#52734d"/>
<text x="468" y="486" font-size="12" font-weight="700">EXISTENTE</text>
<text x="468" y="514" font-size="18" font-weight="700">Refeições e alimentos</text>
<text x="468" y="562" font-size="15" font-weight="400">Diário → refeição/item → correção</text>
<text x="468" y="580" font-size="15" font-weight="400">ou exclusão confirmada.</text>
<rect x="840" y="460" width="330" height="180" rx="15" fill="#d5e8d4" stroke="#52734d"/>
<text x="858" y="486" font-size="12" font-weight="700">EXISTENTE</text>
<text x="858" y="514" font-size="18" font-weight="700">Busca de alimentos</text>
<text x="858" y="562" font-size="15" font-weight="400">Pesquisar → detalhe → quantidade →</text>
<text x="858" y="580" font-size="15" font-weight="400">confirmação.</text>
<rect x="60" y="730" width="330" height="180" rx="15" fill="#d5e8d4" stroke="#52734d"/>
<text x="78" y="756" font-size="12" font-weight="700">EXISTENTE</text>
<text x="78" y="784" font-size="18" font-weight="700">Configuração</text>
<text x="78" y="832" font-size="15" font-weight="400">Quatro etapas → revisão →</text>
<text x="78" y="850" font-size="15" font-weight="400">confirmação.</text>
<rect x="450" y="730" width="330" height="180" rx="15" fill="#d5e8d4" stroke="#52734d"/>
<text x="468" y="756" font-size="12" font-weight="700">EXISTENTE</text>
<text x="468" y="784" font-size="18" font-weight="700">Fontes e transparência</text>
<text x="468" y="832" font-size="15" font-weight="400">Originais, autoria, licença e</text>
<text x="468" y="850" font-size="15" font-weight="400">cálculo detalhado.</text>
<rect x="840" y="730" width="330" height="180" rx="15" fill="#d5e8d4" stroke="#52734d"/>
<text x="858" y="756" font-size="12" font-weight="700">EXISTENTE</text>
<text x="858" y="784" font-size="18" font-weight="700">Privacidade</text>
<text x="858" y="832" font-size="15" font-weight="400">Política; dados próprios e exclusão</text>
<text x="858" y="850" font-size="15" font-weight="400">confirmada.</text>
<text x="40" y="950" font-size="16" font-weight="700">Conexões (mesma ordem do arquivo editável)</text>
<text x="40" y="978" font-size="14" font-weight="400">Inicialização / entrada → Hoje / ProductShell: sessão válida</text>
<text x="40" y="1004" font-size="14" font-weight="400">Hoje / ProductShell → Biblioteca: consultar</text>
<text x="40" y="1030" font-size="14" font-weight="400">Hoje / ProductShell → Seu espaço: avatar</text>
<text x="40" y="1056" font-size="14" font-weight="400">Hoje / ProductShell → Refeições e alimentos: alimentação</text>
<text x="40" y="1082" font-size="14" font-weight="400">Refeições e alimentos → Busca de alimentos: adicionar</text>
<text x="40" y="1108" font-size="14" font-weight="400">Seu espaço → Configuração: rotina</text>
<text x="40" y="1134" font-size="14" font-weight="400">Seu espaço → Fontes e transparência: comprovação</text>
<text x="40" y="1160" font-size="14" font-weight="400">Seu espaço → Privacidade: conta</text>
</g></svg>
