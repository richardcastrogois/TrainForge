<svg xmlns="http://www.w3.org/2000/svg" width="1230" height="850" viewBox="0 0 1230 850" role="img">
<title>Publicação e leitura do catálogo</title>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs>
<rect width="1230" height="850" fill="#ffffff"/>
<g font-family="Inter,Arial,sans-serif" fill="#18332e">
<text x="40" y="60" font-size="18" font-weight="700">Publicação e leitura do catálogo</text>
<text x="40" y="100" font-size="15" font-weight="400">M0–M4 fecham a primeira extração do catálogo. Comprar mídia não publica automaticamente programas ou doses.</text>
<path d="M390,280 L450,280" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M780,280 L840,280" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M1005,370 L1005,415.0 L225,415.0 L225,460" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M390,550 L450,550" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M780,550 L840,550" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="60" y="190" width="330" height="180" rx="15" fill="#d5e8d4" stroke="#52734d"/>
<text x="78" y="216" font-size="12" font-weight="700">EXISTENTE</text>
<text x="78" y="244" font-size="18" font-weight="700">Fonte e direitos</text>
<text x="78" y="292" font-size="15" font-weight="400">Autoria, licença, versão e uso</text>
<text x="78" y="310" font-size="15" font-weight="400">permitido.</text>
<rect x="450" y="190" width="330" height="180" rx="15" fill="#fff2cc" stroke="#9c7b18"/>
<text x="468" y="216" font-size="12" font-weight="700">PARCIAL</text>
<text x="468" y="244" font-size="18" font-weight="700">Revisão humana</text>
<text x="468" y="292" font-size="15" font-weight="400">Separar movimento, instrução, mídia</text>
<text x="468" y="310" font-size="15" font-weight="400">e programa.</text>
<rect x="840" y="190" width="330" height="180" rx="15" fill="#d5e8d4" stroke="#52734d"/>
<text x="858" y="216" font-size="12" font-weight="700">EXISTENTE</text>
<text x="858" y="244" font-size="18" font-weight="700">Publicação editorial</text>
<text x="858" y="292" font-size="15" font-weight="400">Artefato/digest imutável;</text>
<text x="858" y="310" font-size="15" font-weight="400">autoridade e retirada.</text>
<rect x="60" y="460" width="330" height="180" rx="15" fill="#d5e8d4" stroke="#52734d"/>
<text x="78" y="486" font-size="12" font-weight="700">EXISTENTE</text>
<text x="78" y="514" font-size="18" font-weight="700">Catálogo separado</text>
<text x="78" y="562" font-size="15" font-weight="400">Leitor sem acesso às tabelas</text>
<text x="78" y="580" font-size="15" font-weight="400">pessoais.</text>
<rect x="450" y="460" width="330" height="180" rx="15" fill="#d5e8d4" stroke="#52734d"/>
<text x="468" y="486" font-size="12" font-weight="700">EXISTENTE</text>
<text x="468" y="514" font-size="18" font-weight="700">API / bridge</text>
<text x="468" y="562" font-size="15" font-weight="400">Confere autoridade atual; sem</text>
<text x="468" y="580" font-size="15" font-weight="400">fallback automático antigo.</text>
<rect x="840" y="460" width="330" height="180" rx="15" fill="#d5e8d4" stroke="#52734d"/>
<text x="858" y="486" font-size="12" font-weight="700">EXISTENTE</text>
<text x="858" y="514" font-size="18" font-weight="700">Biblioteca</text>
<text x="858" y="562" font-size="15" font-weight="400">73movimentos consultáveis; zero</text>
<text x="858" y="580" font-size="15" font-weight="400">programas liberados.</text>
<text x="40" y="680" font-size="16" font-weight="700">Conexões (mesma ordem do arquivo editável)</text>
<text x="40" y="708" font-size="14" font-weight="400">Fonte e direitos → Revisão humana: verificar</text>
<text x="40" y="734" font-size="14" font-weight="400">Revisão humana → Publicação editorial: somente aprovado</text>
<text x="40" y="760" font-size="14" font-weight="400">Publicação editorial → Catálogo separado: versão</text>
<text x="40" y="786" font-size="14" font-weight="400">Catálogo separado → API / bridge: cinco rotas</text>
<text x="40" y="812" font-size="14" font-weight="400">API / bridge → Biblioteca: referência</text>
</g></svg>
