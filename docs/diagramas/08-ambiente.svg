<svg xmlns="http://www.w3.org/2000/svg" width="1230" height="850" viewBox="0 0 1230 850" role="img">
<title>Iniciar, observar e parar</title>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs>
<rect width="1230" height="850" fill="#ffffff"/>
<g font-family="Inter,Arial,sans-serif" fill="#18332e">
<text x="40" y="60" font-size="18" font-weight="700">Iniciar, observar e parar</text>
<text x="40" y="100" font-size="15" font-weight="400">status e plan-stop só consultam. Não executar init/activate/restore para abrir o app no dia a dia.</text>
<path d="M390,280 L450,280" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M780,280 L840,280" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M1005,370 L1005,415.0 L225,415.0 L225,460" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M390,550 L450,550" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M780,550 L840,550" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="60" y="190" width="330" height="180" rx="15" fill="#d5e8d4" stroke="#52734d"/>
<text x="78" y="216" font-size="12" font-weight="700">EXISTENTE</text>
<text x="78" y="244" font-size="18" font-weight="700">ambiente start</text>
<text x="78" y="292" font-size="15" font-weight="400">Reutiliza ferramentas e</text>
<text x="78" y="310" font-size="15" font-weight="400">configuração já existentes.</text>
<rect x="450" y="190" width="330" height="180" rx="15" fill="#d5e8d4" stroke="#52734d"/>
<text x="468" y="216" font-size="12" font-weight="700">EXISTENTE</text>
<text x="468" y="244" font-size="18" font-weight="700">1. PostgreSQL15432</text>
<text x="468" y="292" font-size="15" font-weight="400">Inicia apenas o cluster local</text>
<text x="468" y="310" font-size="15" font-weight="400">registrado.</text>
<rect x="840" y="190" width="330" height="180" rx="15" fill="#d5e8d4" stroke="#52734d"/>
<text x="858" y="216" font-size="12" font-weight="700">EXISTENTE</text>
<text x="858" y="244" font-size="18" font-weight="700">2. Catálogo18083</text>
<text x="858" y="292" font-size="15" font-weight="400">Reutiliza a base já provisionada;</text>
<text x="858" y="310" font-size="15" font-weight="400">não ativa migrations.</text>
<rect x="60" y="460" width="330" height="180" rx="15" fill="#d5e8d4" stroke="#52734d"/>
<text x="78" y="486" font-size="12" font-weight="700">EXISTENTE</text>
<text x="78" y="514" font-size="18" font-weight="700">3. API8082</text>
<text x="78" y="562" font-size="15" font-weight="400">Watcher local; build e Swagger</text>
<text x="78" y="580" font-size="15" font-weight="400">quando as fontes mudam.</text>
<rect x="450" y="460" width="330" height="180" rx="15" fill="#d5e8d4" stroke="#52734d"/>
<text x="468" y="486" font-size="12" font-weight="700">EXISTENTE</text>
<text x="468" y="514" font-size="18" font-weight="700">4. Emulador / APK</text>
<text x="468" y="562" font-size="15" font-weight="400">TrainForge_Benchmark; instala</text>
<text x="468" y="580" font-size="15" font-weight="400">somente se necessário.</text>
<rect x="840" y="460" width="330" height="180" rx="15" fill="#d5e8d4" stroke="#52734d"/>
<text x="858" y="486" font-size="12" font-weight="700">EXISTENTE</text>
<text x="858" y="514" font-size="18" font-weight="700">ambiente stop</text>
<text x="858" y="562" font-size="15" font-weight="400">API → catálogo → AVD registrado →</text>
<text x="858" y="580" font-size="15" font-weight="400">banco; sem wipe.</text>
<text x="40" y="680" font-size="16" font-weight="700">Conexões (mesma ordem do arquivo editável)</text>
<text x="40" y="708" font-size="14" font-weight="400">ambiente start → 1. PostgreSQL15432: ordem</text>
<text x="40" y="734" font-size="14" font-weight="400">1. PostgreSQL15432 → 2. Catálogo18083: ordem</text>
<text x="40" y="760" font-size="14" font-weight="400">2. Catálogo18083 → 3. API8082: ordem</text>
<text x="40" y="786" font-size="14" font-weight="400">3. API8082 → 4. Emulador / APK: ordem</text>
<text x="40" y="812" font-size="14" font-weight="400">4. Emulador / APK → ambiente stop: salvar antes</text>
</g></svg>
