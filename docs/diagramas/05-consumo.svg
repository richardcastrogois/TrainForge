<svg xmlns="http://www.w3.org/2000/svg" width="1230" height="850" viewBox="0 0 1230 850" role="img">
<title>Da quantidade ao registro alimentar</title>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs>
<rect width="1230" height="850" fill="#ffffff"/>
<g font-family="Inter,Arial,sans-serif" fill="#18332e">
<text x="40" y="60" font-size="18" font-weight="700">Da quantidade ao registro alimentar</text>
<text x="40" y="100" font-size="15" font-weight="400">Foto ainda não integra este fluxo. Uma busca ou rascunho não prova que a pessoa consumiu algo.</text>
<path d="M390,280 L450,280" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M780,280 L840,280" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M1005,370 L1005,415.0 L225,415.0 L225,460" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M390,550 L450,550" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M780,550 L840,550" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="60" y="190" width="330" height="180" rx="15" fill="#d5e8d4" stroke="#52734d"/>
<text x="78" y="216" font-size="12" font-weight="700">EXISTENTE</text>
<text x="78" y="244" font-size="18" font-weight="700">Pesquisar</text>
<text x="78" y="292" font-size="15" font-weight="400">Nome/atalho → alimento e versão</text>
<text x="78" y="310" font-size="15" font-weight="400">exatos.</text>
<rect x="450" y="190" width="330" height="180" rx="15" fill="#d5e8d4" stroke="#52734d"/>
<text x="468" y="216" font-size="12" font-weight="700">EXISTENTE</text>
<text x="468" y="244" font-size="18" font-weight="700">Preencher</text>
<text x="468" y="292" font-size="15" font-weight="400">Pessoa informa quantidade, unidade,</text>
<text x="468" y="310" font-size="15" font-weight="400">horário e medida/estimativa.</text>
<rect x="840" y="190" width="330" height="180" rx="15" fill="#d5e8d4" stroke="#52734d"/>
<text x="858" y="216" font-size="12" font-weight="700">EXISTENTE</text>
<text x="858" y="244" font-size="18" font-weight="700">Confirmar</text>
<text x="858" y="292" font-size="15" font-weight="400">POST privado; titular e chave</text>
<text x="858" y="310" font-size="15" font-weight="400">idempotente.</text>
<rect x="60" y="460" width="330" height="180" rx="15" fill="#d5e8d4" stroke="#52734d"/>
<text x="78" y="486" font-size="12" font-weight="700">EXISTENTE</text>
<text x="78" y="514" font-size="18" font-weight="700">Validar e calcular</text>
<text x="78" y="562" font-size="15" font-weight="400">API preserva unidade, versão e</text>
<text x="78" y="580" font-size="15" font-weight="400">desconhecidos.</text>
<rect x="450" y="460" width="330" height="180" rx="15" fill="#d5e8d4" stroke="#52734d"/>
<text x="468" y="486" font-size="12" font-weight="700">EXISTENTE</text>
<text x="468" y="514" font-size="18" font-weight="700">Persistir</text>
<text x="468" y="562" font-size="15" font-weight="400">food_entries + vínculos em</text>
<text x="468" y="580" font-size="15" font-weight="400">meal_items quando aplicável.</text>
<rect x="840" y="460" width="330" height="180" rx="15" fill="#d5e8d4" stroke="#52734d"/>
<text x="858" y="486" font-size="12" font-weight="700">EXISTENTE</text>
<text x="858" y="514" font-size="18" font-weight="700">Mostrar diário</text>
<text x="858" y="562" font-size="15" font-weight="400">Mesmos registros nas visões por</text>
<text x="858" y="580" font-size="15" font-weight="400">refeição e por alimento.</text>
<text x="40" y="680" font-size="16" font-weight="700">Conexões (mesma ordem do arquivo editável)</text>
<text x="40" y="708" font-size="14" font-weight="400">Pesquisar → Preencher: selecionar versão</text>
<text x="40" y="734" font-size="14" font-weight="400">Preencher → Confirmar: revisão humana</text>
<text x="40" y="760" font-size="14" font-weight="400">Confirmar → Validar e calcular: JSON</text>
<text x="40" y="786" font-size="14" font-weight="400">Validar e calcular → Persistir: transação</text>
<text x="40" y="812" font-size="14" font-weight="400">Persistir → Mostrar diário: resposta confirmada</text>
</g></svg>
