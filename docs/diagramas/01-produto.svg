<svg xmlns="http://www.w3.org/2000/svg" width="1230" height="798" viewBox="0 0 1230 798" role="img">
<title>O que o TrainForge oferece</title>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs>
<rect width="1230" height="798" fill="#ffffff"/>
<g font-family="Inter,Arial,sans-serif" fill="#18332e">
<text x="40" y="60" font-size="18" font-weight="700">O que o TrainForge oferece</text>
<text x="40" y="100" font-size="15" font-weight="400">Verde: existente; amarelo: parcial; tracejado: planejado. Casa, praça, academia, idosos e cuidador praticante continuam no</text>
<text x="40" y="120" font-size="15" font-weight="400">escopo.</text>
<path d="M780,280 L840,280" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M390,550 L450,550" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M1005,370 L1005,415.0 L1005,415.0 L1005,460" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="60" y="190" width="330" height="180" rx="15" fill="#d5e8d4" stroke="#52734d"/>
<text x="78" y="216" font-size="12" font-weight="700">EXISTENTE</text>
<text x="78" y="244" font-size="18" font-weight="700">Bibliotecas</text>
<text x="78" y="292" font-size="15" font-weight="400">Movimentos e alimentos reais;</text>
<text x="78" y="310" font-size="15" font-weight="400">consulta pública.</text>
<rect x="450" y="190" width="330" height="180" rx="15" fill="#d5e8d4" stroke="#52734d"/>
<text x="468" y="216" font-size="12" font-weight="700">EXISTENTE</text>
<text x="468" y="244" font-size="18" font-weight="700">Conta pessoal</text>
<text x="468" y="292" font-size="15" font-weight="400">Google, sessão, privacidade e</text>
<text x="468" y="310" font-size="15" font-weight="400">preferências.</text>
<rect x="840" y="190" width="330" height="180" rx="15" fill="#fff2cc" stroke="#9c7b18"/>
<text x="858" y="216" font-size="12" font-weight="700">PARCIAL</text>
<text x="858" y="244" font-size="18" font-weight="700">Alimentação manual</text>
<text x="858" y="292" font-size="15" font-weight="400">Alimento próprio, consumo e</text>
<text x="858" y="310" font-size="15" font-weight="400">refeições; aceite completo</text>
<text x="858" y="328" font-size="15" font-weight="400">pendente.</text>
<rect x="60" y="460" width="330" height="180" rx="15" fill="#d5e8d4" stroke="#52734d"/>
<text x="78" y="486" font-size="12" font-weight="700">EXISTENTE</text>
<text x="78" y="514" font-size="18" font-weight="700">Configuração de treino</text>
<text x="78" y="562" font-size="15" font-weight="400">Rotina, locais, recursos e</text>
<text x="78" y="580" font-size="15" font-weight="400">disponibilidade.</text>
<rect x="450" y="460" width="330" height="180" rx="15" fill="#f5f5f5" stroke="#777777" stroke-dasharray="7 5"/>
<text x="468" y="486" font-size="12" font-weight="700">PLANEJADO</text>
<text x="468" y="514" font-size="18" font-weight="700">Treino completo</text>
<text x="468" y="562" font-size="15" font-weight="400">Selecionar, compor, agendar,</text>
<text x="468" y="580" font-size="15" font-weight="400">executar e retomar.</text>
<rect x="840" y="460" width="330" height="180" rx="15" fill="#f5f5f5" stroke="#777777" stroke-dasharray="7 5"/>
<text x="858" y="486" font-size="12" font-weight="700">PLANEJADO</text>
<text x="858" y="514" font-size="18" font-weight="700">Foto e análise</text>
<text x="858" y="562" font-size="15" font-weight="400">Candidatos editáveis, quantidade,</text>
<text x="858" y="580" font-size="15" font-weight="400">fotos pela conta e dicas revisadas.</text>
<text x="40" y="680" font-size="16" font-weight="700">Conexões (mesma ordem do arquivo editável)</text>
<text x="40" y="708" font-size="14" font-weight="400">Conta pessoal → Alimentação manual: titular</text>
<text x="40" y="734" font-size="14" font-weight="400">Configuração de treino → Treino completo: pré-requisito</text>
<text x="40" y="760" font-size="14" font-weight="400">Alimentação manual → Foto e análise: evolução</text>
</g></svg>
