<svg xmlns="http://www.w3.org/2000/svg" width="1230" height="850" viewBox="0 0 1230 850" role="img">
<title>Como a sessão nasce e continua</title>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs>
<rect width="1230" height="850" fill="#ffffff"/>
<g font-family="Inter,Arial,sans-serif" fill="#18332e">
<text x="40" y="60" font-size="18" font-weight="700">Como a sessão nasce e continua</text>
<text x="40" y="100" font-size="15" font-weight="400">Diagrama omite valores de tokens. Falha de rede não equivale a revogação; login real não é comprovado por fixtures.</text>
<path d="M390,280 L450,280" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M780,280 L840,280" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M1005,370 L1005,415.0 L225,415.0 L225,460" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M390,550 L450,550" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<path d="M780,550 L840,550" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
<rect x="60" y="190" width="330" height="180" rx="15" fill="#d5e8d4" stroke="#52734d"/>
<text x="78" y="216" font-size="12" font-weight="700">EXISTENTE</text>
<text x="78" y="244" font-size="18" font-weight="700">Pessoa</text>
<text x="78" y="292" font-size="15" font-weight="400">Toca Entrar com Google e confirma</text>
<text x="78" y="310" font-size="15" font-weight="400">sua conta.</text>
<rect x="450" y="190" width="330" height="180" rx="15" fill="#e1d5e7" stroke="#756080"/>
<text x="468" y="216" font-size="12" font-weight="700">EXTERNO</text>
<text x="468" y="244" font-size="18" font-weight="700">Google</text>
<text x="468" y="292" font-size="15" font-weight="400">Entrega uma identidade assinada;</text>
<text x="468" y="310" font-size="15" font-weight="400">não uma sessão do TrainForge.</text>
<rect x="840" y="190" width="330" height="180" rx="15" fill="#d5e8d4" stroke="#52734d"/>
<text x="858" y="216" font-size="12" font-weight="700">EXISTENTE</text>
<text x="858" y="244" font-size="18" font-weight="700">POST auth/google</text>
<text x="858" y="292" font-size="15" font-weight="400">API confere assinatura, emissor,</text>
<text x="858" y="310" font-size="15" font-weight="400">audiência e validade.</text>
<rect x="60" y="460" width="330" height="180" rx="15" fill="#d5e8d4" stroke="#52734d"/>
<text x="78" y="486" font-size="12" font-weight="700">EXISTENTE</text>
<text x="78" y="514" font-size="18" font-weight="700">PostgreSQL</text>
<text x="78" y="562" font-size="15" font-weight="400">Usuário, família, access e refresh</text>
<text x="78" y="580" font-size="15" font-weight="400">conforme o contrato.</text>
<rect x="450" y="460" width="330" height="180" rx="15" fill="#d5e8d4" stroke="#52734d"/>
<text x="468" y="486" font-size="12" font-weight="700">EXISTENTE</text>
<text x="468" y="514" font-size="18" font-weight="700">Armazenamento seguro</text>
<text x="468" y="562" font-size="15" font-weight="400">Tokens no dispositivo; reset</text>
<text x="468" y="580" font-size="15" font-weight="400">automático em erro desativado.</text>
<rect x="840" y="460" width="330" height="180" rx="15" fill="#d5e8d4" stroke="#52734d"/>
<text x="858" y="486" font-size="12" font-weight="700">EXISTENTE</text>
<text x="858" y="514" font-size="18" font-weight="700">Chamadas e renovação</text>
<text x="858" y="562" font-size="15" font-weight="400">Bearer nas rotas privadas; refresh</text>
<text x="858" y="580" font-size="15" font-weight="400">rotativo; logout revoga.</text>
<text x="40" y="680" font-size="16" font-weight="700">Conexões (mesma ordem do arquivo editável)</text>
<text x="40" y="708" font-size="14" font-weight="400">Pessoa → Google: consentimento</text>
<text x="40" y="734" font-size="14" font-weight="400">Google → POST auth/google: ID token</text>
<text x="40" y="760" font-size="14" font-weight="400">POST auth/google → PostgreSQL: transação</text>
<text x="40" y="786" font-size="14" font-weight="400">PostgreSQL → Armazenamento seguro: credenciais da sessão</text>
<text x="40" y="812" font-size="14" font-weight="400">Armazenamento seguro → Chamadas e renovação: uso autenticado</text>
</g></svg>
