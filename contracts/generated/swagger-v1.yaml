          schema:
            $ref: '#/definitions/httpapi.Problem'
        "415":
          description: Unsupported Media Type
          schema:
            $ref: '#/definitions/httpapi.Problem'
        "426":
          description: Upgrade Required
          schema:
            $ref: '#/definitions/httpapi.Problem'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/httpapi.Problem'
        "503":
          description: Service Unavailable
          schema:
