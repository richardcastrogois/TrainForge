basePath: /
definitions:
  auth.GoogleRequest:
    properties:
      idToken:
        maxLength: 16384
        minLength: 1
        type: string
    type: object
  auth.RefreshRequest:
    properties:
      refreshToken:
        maxLength: 128
        minLength: 1
        type: string
    type: object
  auth.Session:
    properties:
      accessToken:
        type: string
      expiresIn:
        type: integer
      refreshToken:
        type: string
      user:
        $ref: '#/definitions/auth.User'
    type: object
  auth.User:
    properties:
      email:
        type: string
      id:
        type: string
      image:
        type: string
        x-nullable: true
      name:
        type: string
    type: object
  catalog.Availability:
    properties:
      consultation:
        type: boolean
      instruction:
        type: boolean
      media:
        type: boolean
      practice:
        type: boolean
      reasons:
        items:
          type: string
        type: array
    type: object
  catalog.CatalogAudience:
    properties:
      environment:
        items:
          type: string
        type: array
        x-nullable: true
      population:
        items:
          type: string
        type: array
        x-nullable: true
      supportRequired:
        type: boolean
        x-nullable: true
      supportSource:
        type: string
        x-nullable: true
    type: object
  catalog.CatalogFacets:
    properties:
      categories:
        items:
          type: string
        type: array
      environments:
        items:
          type: string
        type: array
      equipment:
        items:
          type: string
        type: array
      modalities:
        items:
          type: string
        type: array
      movementCount:
        type: integer
      populations:
        items:
          type: string
        type: array
      programCount:
        type: integer
      unknownEnvironmentCount:
        type: integer
      unknownPopulationCount:
        type: integer
    type: object
  catalog.CatalogItem:
    properties:
      audience:
        $ref: '#/definitions/catalog.CatalogAudience'
      authors:
        items:
          type: string
        type: array
      availability:
        $ref: '#/definitions/catalog.Availability'
      id:
        type: string
      kind:
        type: string
      locale:
        type: string
        x-nullable: true
      requirements:
        $ref: '#/definitions/catalog.Requirements'
      rights:
        $ref: '#/definitions/catalog.CatalogRights'
      source:
        $ref: '#/definitions/catalog.CatalogSource'
      sourcePublishedVersion:
        type: string
        x-nullable: true
      title:
        type: string
        x-nullable: true
      versionId:
        type: string
    type: object
  catalog.CatalogPage:
    properties:
      items:
        items:
          $ref: '#/definitions/catalog.CatalogItem'
        type: array
      mode:
        type: string
      nextCursor:
        type: string
        x-nullable: true
      notice:
        type: string
    type: object
  catalog.CatalogRights:
    properties:
      attribution:
        type: string
        x-nullable: true
      deliveryConditions:
        items:
          type: string
        type: array
      displayCredits:
        $ref: '#/definitions/catalog.Credits'
      label:
        type: string
        x-nullable: true
      licenseUrl:
        type: string
        x-nullable: true
      scope:
        type: string
        x-nullable: true
    type: object
  catalog.CatalogSource:
    properties:
      id:
        type: string
      name:
        type: string
      publisher:
        type: string
        x-nullable: true
      urls:
        items:
          type: string
        type: array
    type: object
  catalog.Credits:
    properties:
      changes:
        type: string
        x-nullable: true
      creators:
        items:
          type: string
        type: array
      licenseLabel:
        type: string
        x-nullable: true
      licenseUrl:
        type: string
        x-nullable: true
      selectedNameCredit:
        allOf:
        - $ref: '#/definitions/catalog.NameCredit'
        x-nullable: true
      sourceUrl:
        type: string
        x-nullable: true
      title:
        type: string
        x-nullable: true
      warrantyNotice:
        type: string
        x-nullable: true
    type: object
  catalog.Label:
    properties:
      id:
        type: integer
        x-nullable: true
      name:
        type: string
    type: object
  catalog.NameCredit:
    properties:
      creators:
        items:
          type: string
        type: array
      licenseUrl:
        type: string
        x-nullable: true
      sourceNameUnchanged:
        type: boolean
        x-nullable: true
      translationId:
        type: string
        x-nullable: true
    type: object
  catalog.Requirements:
    properties:
      category:
        allOf:
        - $ref: '#/definitions/catalog.Label'
        x-nullable: true
      equipment:
        items:
          $ref: '#/definitions/catalog.Label'
        type: array
      modality:
        type: string
        x-nullable: true
    type: object
  httpapi.Problem:
    properties:
      code:
        type: string
      requestId:
        type: string
      status:
        type: integer
      title:
        type: string
      type:
        type: string
    type: object
  httpapi.Status:
    properties:
      status:
        type: string
    type: object
  nutrition.Basis:
    properties:
      quantity:
        type: string
        x-nullable: true
      unit:
        type: string
        x-nullable: true
    type: object
  nutrition.Citation:
    properties:
      attribution:
        type: string
      changes:
        type: string
      conditions:
        items:
          type: string
        type: array
      licenseLabel:
        type: string
      licenseUrl:
        type: string
      name:
        type: string
      publishedAt:
        type: string
      publisher:
        type: string
      sourceUrl:
        type: string
      warrantyNotice:
        type: string
    type: object
  nutrition.ColumnBasis:
    properties:
      kind:
        type: string
      quantity:
        type: integer
      unit:
        type: string
    type: object
  nutrition.FoodCell:
    properties:
      basisQuantity:
        type: string
        x-nullable: true
      basisUnit:
        type: string
        x-nullable: true
      declaredColumnBasis:
        allOf:
        - $ref: '#/definitions/nutrition.ColumnBasis'
        x-nullable: true
      nameOriginal:
        type: string
      rawText:
        type: string
      reasons:
        items:
          type: string
        type: array
      scalingAllowed:
        type: boolean
      sourceColumnKey:
        type: string
      sourceRowKey:
        type: string
      state:
        type: string
      unit:
        type: string
        x-nullable: true
      upperBound:
        type: string
        x-nullable: true
      value:
        type: string
        x-nullable: true
    type: object
  nutrition.FoodDetail:
    properties:
      basis:
        $ref: '#/definitions/nutrition.Basis'
      id:
        type: string
      nameLocale:
        type: string
      nameOriginal:
        type: string
      notice:
        type: string
      nutrients:
        items:
          $ref: '#/definitions/nutrition.FoodCell'
        type: array
      source:
        $ref: '#/definitions/nutrition.Citation'
      sourceFoodId:
        type: string
      sourceId:
        type: string
      sourcePublishedVersion:
        type: string
      versionId:
        type: string
    type: object
  nutrition.FoodFacets:
    properties:
      sources:
        items:
          $ref: '#/definitions/nutrition.FoodSourceCount'
        type: array
      total:
        type: integer
      unknownBasisCount:
        type: integer
    type: object
  nutrition.FoodPage:
    properties:
      items:
        items:
          $ref: '#/definitions/nutrition.FoodSummary'
        type: array
      nextCursor:
        type: string
        x-nullable: true
      notice:
        type: string
    type: object
  nutrition.FoodSourceCount:
    properties:
      count:
        type: integer
      id:
        type: string
      name:
        type: string
      nameLocale:
        type: string
    type: object
  nutrition.FoodSummary:
    properties:
      basis:
        $ref: '#/definitions/nutrition.Basis'
      id:
        type: string
      nameLocale:
        type: string
      nameOriginal:
        type: string
      source:
        $ref: '#/definitions/nutrition.Citation'
      sourceFoodId:
        type: string
      sourceId:
        type: string
      sourcePublishedVersion:
        type: string
      versionId:
        type: string
    type: object
info:
  contact: {}
  description: Local Google sessions, reviewed movement metadata and food composition
    references. Real Android OAuth validation remains an acceptance gate; no executable
    training content is implied.
  title: TrainForge API
  version: 0.3.0
paths:
  /api/v1/auth/google:
    post:
      consumes:
      - application/json
      parameters:
      - description: Google ID token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.GoogleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.Session'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpapi.Problem'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpapi.Problem'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/httpapi.Problem'
        "415":
          description: Unsupported Media Type
          schema:
            $ref: '#/definitions/httpapi.Problem'
        "426":
          description: Upgrade Required
          schema:
            $ref: '#/definitions/httpapi.Problem'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/httpapi.Problem'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/httpapi.Problem'
      summary: Exchange Google ID token
      tags:
      - auth
  /api/v1/auth/logout:
    post:
      consumes:
      - application/json
      parameters:
      - description: Refresh token of the device
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.RefreshRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpapi.Problem'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/httpapi.Problem'
        "415":
          description: Unsupported Media Type
          schema:
            $ref: '#/definitions/httpapi.Problem'
        "426":
          description: Upgrade Required
          schema:
            $ref: '#/definitions/httpapi.Problem'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/httpapi.Problem'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/httpapi.Problem'
      summary: Revoke the current device session
      tags:
      - auth
  /api/v1/auth/refresh:
    post:
      consumes:
      - application/json
      parameters:
      - description: Single-use refresh token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.Session'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpapi.Problem'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpapi.Problem'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/httpapi.Problem'
        "415":
          description: Unsupported Media Type
          schema:
            $ref: '#/definitions/httpapi.Problem'
        "426":
          description: Upgrade Required
          schema:
            $ref: '#/definitions/httpapi.Problem'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/httpapi.Problem'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/httpapi.Problem'
      summary: Rotate session credentials
      tags:
      - auth
  /api/v1/catalog/filters:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/catalog.CatalogFacets'
        "304":
          description: Not Modified
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpapi.Problem'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/httpapi.Problem'
      summary: Source-backed catalog filters and coverage
      tags:
      - catalog
  /api/v1/catalog/movements:
    get:
      parameters:
      - description: consultation or practice
        enum:
        - consultation
        - practice
        in: query
        name: mode
        type: string
      - description: Literal title substring
        in: query
        name: q
        type: string
      - description: Exact source environment
        in: query
        name: environment
        type: string
      - description: Exact source population
        in: query
        name: population
        type: string
      - description: Exact source modality
        in: query
        name: modality
        type: string
      - description: Exact source equipment name
        in: query
        name: equipment
        type: string
      - description: Exact source category
        in: query
        name: category
        type: string
      - default: 20
        description: Page size
        in: query
        maximum: 50
        minimum: 1
        name: limit
        type: integer
      - description: Opaque cursor bound to filters
        in: query
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/catalog.CatalogPage'
        "304":
          description: Not Modified
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpapi.Problem'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/httpapi.Problem'
      summary: List reviewed movement metadata
      tags:
      - catalog
  /api/v1/catalog/movements/{id}:
    get:
      parameters:
      - description: Editorial movement ID
        in: path
        name: id
        required: true
        type: string
      - description: Exact SHA-256 version
        in: query
        name: versionId
        type: string
      - description: consultation or practice
        enum:
        - consultation
        - practice
        in: query
        name: mode
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/catalog.CatalogItem'
        "304":
          description: Not Modified
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpapi.Problem'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpapi.Problem'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/httpapi.Problem'
      summary: Reviewed movement metadata
      tags:
      - catalog
  /api/v1/catalog/programs:
    get:
      parameters:
      - description: consultation (default) or practice; unknown requirements never
          imply eligibility
        enum:
        - consultation
        - practice
        in: query
        name: mode
        type: string
      - description: Literal title substring, maximum 100 UTF-8 bytes
        in: query
        name: q
        type: string
      - description: Exact source environment; unknown values do not match
        in: query
        name: environment
        type: string
      - description: Exact source population
        in: query
        name: population
        type: string
      - description: Exact source modality
        in: query
        name: modality
        type: string
      - description: Exact source equipment name
        in: query
        name: equipment
        type: string
      - description: Exact source category
        in: query
        name: category
        type: string
      - default: 20
        description: Page size
        in: query
        maximum: 50
        minimum: 1
        name: limit
        type: integer
      - description: Opaque cursor bound to the filters and page size
        in: query
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/catalog.CatalogPage'
        "304":
          description: Not Modified
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpapi.Problem'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/httpapi.Problem'
      summary: List reviewed program and collection metadata
      tags:
      - catalog
  /api/v1/catalog/programs/{id}:
    get:
      parameters:
      - description: Editorial asset ID
        in: path
        name: id
        required: true
        type: string
      - description: Exact SHA-256 version; latest by default
        in: query
        name: versionId
        type: string
      - description: consultation or practice
        enum:
        - consultation
        - practice
        in: query
        name: mode
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/catalog.CatalogItem'
        "304":
          description: Not Modified
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpapi.Problem'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpapi.Problem'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/httpapi.Problem'
      summary: Reviewed program or collection metadata
      tags:
      - catalog
  /api/v1/foods:
    get:
      parameters:
      - description: Literal original-name substring with collapsed whitespace; maximum
          100 UTF-8 bytes
        in: query
        name: q
        type: string
      - description: Exact reviewed source ID
        in: query
        name: sourceId
        type: string
      - default: 20
        description: Page size
        in: query
        maximum: 50
        minimum: 1
        name: limit
        type: integer
      - description: Opaque cursor bound to search, source and page size
        in: query
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/nutrition.FoodPage'
        "304":
          description: Not Modified
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpapi.Problem'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/httpapi.Problem'
      summary: Search reviewed food references
      tags:
      - nutrition
  /api/v1/foods/{id}:
    get:
      parameters:
      - description: Source-derived food ID
        in: path
        name: id
        required: true
        type: string
      - description: Exact SHA-256 version; latest by default
        in: query
        name: versionId
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/nutrition.FoodDetail'
        "304":
          description: Not Modified
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpapi.Problem'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpapi.Problem'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/httpapi.Problem'
      summary: Reviewed food composition and attribution
      tags:
      - nutrition
  /api/v1/foods/filters:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/nutrition.FoodFacets'
        "304":
          description: Not Modified
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpapi.Problem'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/httpapi.Problem'
      summary: Reviewed food sources and coverage
      tags:
      - nutrition
  /api/v1/health/live:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpapi.Status'
      summary: Process liveness
      tags:
      - operation
  /api/v1/health/ready:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpapi.Status'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/httpapi.Problem'
      summary: Database readiness
      tags:
      - operation
  /api/v1/me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.User'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpapi.Problem'
        "426":
          description: Upgrade Required
          schema:
            $ref: '#/definitions/httpapi.Problem'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/httpapi.Problem'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/httpapi.Problem'
      security:
      - BearerAuth: []
      summary: Current authenticated identity
      tags:
      - auth
schemes:
- http
- https
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
