basePath: /
definitions:
  auth.GoogleRequest:
    properties:
      idToken:
        maxLength: 16384
        minLength: 1
        type: string
    type: object
  auth.RefreshRequest:
    properties:
      refreshToken:
        maxLength: 128
        minLength: 1
        type: string
    type: object
  auth.Session:
    properties:
      accessToken:
        type: string
      expiresIn:
        type: integer
      refreshToken:
        type: string
      user:
        $ref: '#/definitions/auth.User'
    type: object
  auth.User:
    properties:
      email:
        type: string
      id:
        type: string
      image:
        type: string
      name:
        type: string
    type: object
  httpapi.Problem:
    properties:
      code:
        type: string
      requestId:
        type: string
      status:
        type: integer
      title:
        type: string
      type:
        type: string
    type: object
  httpapi.Status:
    properties:
      status:
        type: string
    type: object
info:
  contact: {}
  description: Local API with Google credential exchange and device sessions. Real
    Android OAuth validation remains an acceptance gate.
  title: TrainForge API
  version: 0.1.0
paths:
  /api/v1/auth/google:
    post:
      consumes:
      - application/json
      parameters:
      - description: Google ID token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.GoogleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.Session'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpapi.Problem'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpapi.Problem'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/httpapi.Problem'
        "415":
          description: Unsupported Media Type
          schema:
            $ref: '#/definitions/httpapi.Problem'
        "426":
          description: Upgrade Required
          schema:
            $ref: '#/definitions/httpapi.Problem'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/httpapi.Problem'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/httpapi.Problem'
      summary: Exchange Google ID token
      tags:
      - auth
  /api/v1/auth/logout:
    post:
      consumes:
      - application/json
      parameters:
      - description: Refresh token of the device
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.RefreshRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpapi.Problem'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/httpapi.Problem'
        "415":
          description: Unsupported Media Type
          schema:
            $ref: '#/definitions/httpapi.Problem'
        "426":
          description: Upgrade Required
          schema:
            $ref: '#/definitions/httpapi.Problem'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/httpapi.Problem'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/httpapi.Problem'
      summary: Revoke the current device session
      tags:
      - auth
  /api/v1/auth/refresh:
    post:
      consumes:
      - application/json
      parameters:
      - description: Single-use refresh token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.Session'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpapi.Problem'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpapi.Problem'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/httpapi.Problem'
        "415":
          description: Unsupported Media Type
          schema:
            $ref: '#/definitions/httpapi.Problem'
        "426":
          description: Upgrade Required
          schema:
            $ref: '#/definitions/httpapi.Problem'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/httpapi.Problem'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/httpapi.Problem'
      summary: Rotate session credentials
      tags:
      - auth
  /api/v1/health/live:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpapi.Status'
      summary: Process liveness
      tags:
      - operation
  /api/v1/health/ready:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpapi.Status'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/httpapi.Problem'
      summary: Database readiness
      tags:
      - operation
  /api/v1/me:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.User'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpapi.Problem'
        "426":
          description: Upgrade Required
          schema:
            $ref: '#/definitions/httpapi.Problem'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/httpapi.Problem'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/httpapi.Problem'
      security:
      - BearerAuth: []
      summary: Current authenticated identity
      tags:
      - auth
schemes:
- http
- https
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
