info:
  contact: {}
  description: Google sessions, privacy, reviewed references, private food declarations,
    recorded consumption, atomic meals and durable offline nutrition synchronization.
    No executable training content or prescribed diets.
  title: TrainForge API
  version: 0.11.0
paths:
