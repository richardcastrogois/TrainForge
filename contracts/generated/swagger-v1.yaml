basePath: /
definitions:
  auth.GoogleRequest:
    properties:
      idToken:
        maxLength: 16384
        minLength: 1
        type: string
    type: object
  auth.RefreshRequest:
    properties:
      refreshToken:
        maxLength: 128
        minLength: 1
        type: string
    type: object
  auth.Session:
    properties:
      accessToken:
        type: string
      expiresIn:
        type: integer
      refreshToken:
        type: string
      user:
        $ref: '#/definitions/auth.User'
    type: object
  auth.User:
    properties:
      email:
        type: string
      id:
        type: string
      image:
        type: string
        x-nullable: true
      name:
        type: string
    type: object
  catalog.Availability:
    properties:
      consultation:
        type: boolean
      instruction:
        type: boolean
      media:
        type: boolean
      practice:
        type: boolean
      reasons:
        items:
          type: string
        type: array
    type: object
  catalog.CatalogAudience:
    properties:
      environment:
        items:
          type: string
        type: array
        x-nullable: true
      population:
        items:
          type: string
        type: array
        x-nullable: true
      supportRequired:
        type: boolean
        x-nullable: true
      supportSource:
        type: string
        x-nullable: true
    type: object
  catalog.CatalogFacets:
    properties:
      categories:
        items:
          type: string
        type: array
      environments:
        items:
          type: string
        type: array
      equipment:
        items:
          type: string
        type: array
      modalities:
        items:
          type: string
        type: array
      movementCount:
        type: integer
      populations:
        items:
          type: string
        type: array
      programCount:
        type: integer
      unknownEnvironmentCount:
        type: integer
      unknownPopulationCount:
        type: integer
    type: object
  catalog.CatalogItem:
    properties:
      audience:
        $ref: '#/definitions/catalog.CatalogAudience'
      authors:
        items:
          type: string
        type: array
      availability:
        $ref: '#/definitions/catalog.Availability'
      id:
        type: string
      kind:
        type: string
      locale:
        type: string
        x-nullable: true
      requirements:
        $ref: '#/definitions/catalog.Requirements'
      rights:
        $ref: '#/definitions/catalog.CatalogRights'
      source:
        $ref: '#/definitions/catalog.CatalogSource'
      sourcePublishedVersion:
        type: string
        x-nullable: true
      title:
        type: string
        x-nullable: true
      versionId:
        type: string
    type: object
  catalog.CatalogPage:
    properties:
      items:
        items:
          $ref: '#/definitions/catalog.CatalogItem'
        type: array
      mode:
        type: string
      nextCursor:
        type: string
        x-nullable: true
      notice:
        type: string
    type: object
  catalog.CatalogRights:
    properties:
      attribution:
        type: string
        x-nullable: true
      deliveryConditions:
        items:
          type: string
        type: array
      displayCredits:
        $ref: '#/definitions/catalog.Credits'
      label:
        type: string
        x-nullable: true
      licenseUrl:
        type: string
        x-nullable: true
      scope:
        type: string
        x-nullable: true
    type: object
  catalog.CatalogSource:
    properties:
      id:
        type: string
      name:
        type: string
      publisher:
        type: string
        x-nullable: true
      urls:
        items:
          type: string
        type: array
    type: object
  catalog.Credits:
    properties:
      changes:
        type: string
        x-nullable: true
      creators:
        items:
          type: string
        type: array
      licenseLabel:
        type: string
        x-nullable: true
      licenseUrl:
        type: string
        x-nullable: true
      selectedNameCredit:
        allOf:
        - $ref: '#/definitions/catalog.NameCredit'
        x-nullable: true
      sourceUrl:
        type: string
        x-nullable: true
      title:
        type: string
        x-nullable: true
      warrantyNotice:
        type: string
        x-nullable: true
    type: object
  catalog.Label:
    properties:
      id:
        type: integer
        x-nullable: true
      name:
        type: string
    type: object
  catalog.NameCredit:
    properties:
      creators:
        items:
          type: string
        type: array
      licenseUrl:
        type: string
        x-nullable: true
      sourceNameUnchanged:
        type: boolean
        x-nullable: true
      translationId:
        type: string
        x-nullable: true
    type: object
  catalog.Requirements:
    properties:
      category:
        allOf:
        - $ref: '#/definitions/catalog.Label'
        x-nullable: true
      equipment:
        items:
          $ref: '#/definitions/catalog.Label'
        type: array
      modality:
        type: string
        x-nullable: true
    type: object
  httpapi.Problem:
    properties:
      code:
        type: string
      requestId:
        type: string
      status:
        type: integer
      title:
        type: string
      type:
        type: string
    type: object
  httpapi.Status:
    properties:
      status:
        type: string
    type: object
  nutrition.Basis:
    properties:
      quantity:
        type: string
        x-nullable: true
      unit:
        type: string
        x-nullable: true
    type: object
  nutrition.Calculation:
    properties:
      algorithm:
        type: string
      changes:
        items:
          $ref: '#/definitions/nutrition.EntryChange'
        type: array
      food:
        $ref: '#/definitions/nutrition.FoodSummary'
      nutrients:
        items:
          $ref: '#/definitions/nutrition.ScaledCell'
        type: array
      origin:
        type: string
      preparation:
        type: string
      quantityEvidence:
        type: string
      revision:
        type: integer
    type: object
  nutrition.Citation:
    properties:
      attribution:
        type: string
      changes:
        type: string
      conditions:
        items:
          type: string
        type: array
      licenseLabel:
        type: string
      licenseUrl:
        type: string
      name:
        type: string
      publishedAt:
        type: string
      publisher:
        type: string
      sourceUrl:
        type: string
      warrantyNotice:
        type: string
    type: object
  nutrition.ColumnBasis:
    properties:
      kind:
        type: string
      quantity:
        type: integer
      unit:
        type: string
    type: object
  nutrition.Entry:
    properties:
      calculation:
        $ref: '#/definitions/nutrition.Calculation'
      deletedAt:
        type: string
        x-nullable: true
      foodId:
        type: string
      foodVersion:
        type: string
      id:
        type: string
      occurredAt:
        type: string
      quantity:
        type: string
      timezone:
        type: string
      unit:
        type: string
    type: object
  nutrition.EntryChange:
    properties:
      occurredAt:
        type: string
      preparation:
        type: string
      quantity:
        type: string
      quantityEvidence:
        type: string
      replacedAt:
        type: string
      revision:
        type: integer
      timezone:
        type: string
      unit:
        type: string
    type: object
  nutrition.EntryInput:
    properties:
      foodId:
        type: string
      foodVersion:
        type: string
      occurredAt:
        type: string
      preparation:
        type: string
      quantity:
        type: string
      quantityEvidence:
        type: string
      revision:
        type: integer
      timezone:
        type: string
      unit:
        type: string
    type: object
  nutrition.FoodCell:
    properties:
      basisQuantity:
        type: string
        x-nullable: true
      basisUnit:
        type: string
        x-nullable: true
      declaredColumnBasis:
        allOf:
        - $ref: '#/definitions/nutrition.ColumnBasis'
        x-nullable: true
      nameOriginal:
        type: string
      rawText:
        type: string
      reasons:
        items:
          type: string
        type: array
      scalingAllowed:
        type: boolean
      sourceColumnKey:
        type: string
      sourceRowKey:
        type: string
      state:
        type: string
      unit:
        type: string
        x-nullable: true
      upperBound:
        type: string
        x-nullable: true
      value:
        type: string
        x-nullable: true
    type: object
  nutrition.FoodDetail:
    properties:
      basis:
        $ref: '#/definitions/nutrition.Basis'
      id:
        type: string
      nameCatalog:
        $ref: '#/definitions/nutrition.FoodNameCatalog'
      nameLocale:
        type: string
      nameOriginal:
        type: string
      notice:
        type: string
      nutrients:
        items:
          $ref: '#/definitions/nutrition.FoodCell'
        type: array
      reviewedName:
        $ref: '#/definitions/nutrition.ReviewedNameDisplay'
      source:
        $ref: '#/definitions/nutrition.Citation'
      sourceFoodId:
        type: string
      sourceId:
        type: string
      sourcePublishedVersion:
        type: string
      versionId:
        type: string
    type: object
  nutrition.FoodFacets:
    properties:
      sources:
        items:
          $ref: '#/definitions/nutrition.FoodSourceCount'
        type: array
      total:
        type: integer
      unknownBasisCount:
        type: integer
    type: object
  nutrition.FoodNameCatalog:
    properties:
      locale:
        type: string
      version:
        type: string
    type: object
  nutrition.FoodPage:
    properties:
      items:
        items:
          $ref: '#/definitions/nutrition.FoodSummary'
        type: array
      nameCatalog:
        $ref: '#/definitions/nutrition.FoodNameCatalog'
      nextCursor:
        type: string
        x-nullable: true
      notice:
        type: string
    type: object
  nutrition.FoodSourceCount:
    properties:
      count:
        type: integer
      id:
        type: string
      name:
        type: string
      nameLocale:
        type: string
    type: object
  nutrition.FoodSummary:
    properties:
      basis:
        $ref: '#/definitions/nutrition.Basis'
      id:
        type: string
      nameLocale:
        type: string
      nameOriginal:
        type: string
      reviewedName:
        $ref: '#/definitions/nutrition.ReviewedNameDisplay'
      source:
        $ref: '#/definitions/nutrition.Citation'
      sourceFoodId:
        type: string
      sourceId:
        type: string
      sourcePublishedVersion:
        type: string
      versionId:
        type: string
    type: object
  nutrition.NutrientTotal:
    properties:
      exactFraction:
        type: string
        x-nullable: true
      includedEntries:
        type: integer
      nameOriginal:
        type: string
      sourceColumnKey:
        type: string
      unit:
        type: string
        x-nullable: true
      unknownEntries:
        type: integer
      value:
        type: string
        x-nullable: true
    type: object
  nutrition.NutritionPage:
    properties:
      items:
        items:
          type: object
        type: array
      nextCursor:
        type: string
        x-nullable: true
    type: object
  nutrition.NutritionTotals:
    properties:
      complete:
        type: boolean
      entries:
        type: integer
      estimatedEntries:
        type: integer
      measuredEntries:
        type: integer
      notice:
        type: string
      nutrients:
        items:
          $ref: '#/definitions/nutrition.NutrientTotal'
        type: array
    type: object
  nutrition.OwnFoodInput:
    properties:
      basis:
        $ref: '#/definitions/nutrition.Basis'
      name:
        type: string
      nutrients:
        items:
          $ref: '#/definitions/nutrition.OwnNutrient'
        type: array
      preparation:
        type: string
    type: object
  nutrition.OwnNutrient:
    properties:
      name:
        type: string
      unit:
        type: string
      value:
        type: string
        x-nullable: true
    type: object
  nutrition.ReviewedNameDisplay:
    properties:
      attribution:
        type: string
      licenseLabel:
        type: string
      licenseUrl:
        type: string
      locale:
        type: string
      name:
        type: string
      reviewEvidenceSha256:
        type: string
      rightsEvidenceSha256:
        type: string
      versionId:
        type: string
    type: object
  nutrition.ScaledCell:
    properties:
      basis:
        $ref: '#/definitions/nutrition.Basis'
      exactFraction:
        type: string
        x-nullable: true
      factor:
        type: string
        x-nullable: true
      nameOriginal:
        type: string
      rawText:
        type: string
      reason:
        type: string
      sourceColumnKey:
        type: string
      sourceReasons:
        items:
          type: string
        type: array
      sourceState:
        type: string
      sourceUpperBound:
        type: string
        x-nullable: true
      sourceValue:
        type: string
        x-nullable: true
      unit:
        type: string
        x-nullable: true
      value:
        type: string
        x-nullable: true
    type: object
  privacy.DeleteRequest:
    properties:
      challenge:
        type: string
      confirmation:
        type: string
    type: object
  privacy.Erased:
    properties:
      accountId:
        type: string
      backupNotice:
        type: string
      deleted:
        type: boolean
      erasedAt:
        type: string
    type: object
  privacy.ExportPage:
    properties:
      accountId:
        type: string
      generatedAt:
        type: string
      items:
        items:
          type: object
        type: array
      nextCursor:
        type: string
        x-nullable: true
      notice:
        type: string
      section:
        type: string
    type: object
  privacy.Intent:
    properties:
      challenge:
        type: string
      expiresAt:
        type: string
    type: object
  privacy.IntentRequest:
    properties:
      confirmation:
        type: string
    type: object
  privacy.Policy:
    properties:
      accountDeletion:
        type: string
      backupRetention:
        type: string
      erasureLedger:
        type: string
      exportSections:
        items:
          type: string
        type: array
      freshLoginMinutes:
        type: integer
      futureStorage:
        type: string
      intentMinutes:
        type: integer
      otherServices:
        type: string
      restoreRequirement:
        type: string
      sessionRetention:
        type: string
      version:
        type: string
    type: object
info:
  contact: {}
  description: Google sessions, privacy, reviewed movement and food references, private
    food declarations and explicitly recorded consumption. No executable training
    content or prescribed diets.
  title: TrainForge API
  version: 0.6.0
paths:
  /api/v1/auth/google:
    post:
      consumes:
      - application/json
      parameters:
      - description: Google ID token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.GoogleRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.Session'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpapi.Problem'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpapi.Problem'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/httpapi.Problem'
        "415":
          description: Unsupported Media Type
          schema:
            $ref: '#/definitions/httpapi.Problem'
        "426":
          description: Upgrade Required
          schema:
            $ref: '#/definitions/httpapi.Problem'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/httpapi.Problem'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/httpapi.Problem'
      summary: Exchange Google ID token
      tags:
      - auth
  /api/v1/auth/logout:
    post:
      consumes:
      - application/json
      parameters:
      - description: Refresh token of the device
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.RefreshRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpapi.Problem'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/httpapi.Problem'
        "415":
          description: Unsupported Media Type
          schema:
            $ref: '#/definitions/httpapi.Problem'
        "426":
          description: Upgrade Required
          schema:
            $ref: '#/definitions/httpapi.Problem'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/httpapi.Problem'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/httpapi.Problem'
      summary: Revoke the current device session
      tags:
      - auth
  /api/v1/auth/refresh:
    post:
      consumes:
      - application/json
      parameters:
      - description: Single-use refresh token
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/auth.RefreshRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/auth.Session'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpapi.Problem'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/httpapi.Problem'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/httpapi.Problem'
        "415":
          description: Unsupported Media Type
          schema:
            $ref: '#/definitions/httpapi.Problem'
        "426":
          description: Upgrade Required
          schema:
            $ref: '#/definitions/httpapi.Problem'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/httpapi.Problem'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/httpapi.Problem'
      summary: Rotate session credentials
      tags:
      - auth
  /api/v1/catalog/filters:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/catalog.CatalogFacets'
        "304":
          description: Not Modified
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpapi.Problem'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/httpapi.Problem'
      summary: Source-backed catalog filters and coverage
      tags:
      - catalog
  /api/v1/catalog/movements:
    get:
      parameters:
      - description: consultation or practice
        enum:
        - consultation
        - practice
        in: query
        name: mode
        type: string
      - description: Literal title substring
        in: query
        name: q
        type: string
      - description: Exact source environment
        in: query
        name: environment
        type: string
      - description: Exact source population
        in: query
        name: population
        type: string
      - description: Exact source modality
        in: query
        name: modality
        type: string
      - description: Exact source equipment name
        in: query
        name: equipment
        type: string
      - description: Exact source category
        in: query
        name: category
        type: string
      - default: 20
        description: Page size
        in: query
        maximum: 50
        minimum: 1
        name: limit
        type: integer
      - description: Opaque cursor bound to filters
        in: query
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/catalog.CatalogPage'
        "304":
          description: Not Modified
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpapi.Problem'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/httpapi.Problem'
      summary: List reviewed movement metadata
      tags:
      - catalog
  /api/v1/catalog/movements/{id}:
    get:
      parameters:
      - description: Editorial movement ID
        in: path
        name: id
        required: true
        type: string
      - description: Exact SHA-256 version
        in: query
        name: versionId
        type: string
      - description: consultation or practice
        enum:
        - consultation
        - practice
        in: query
        name: mode
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/catalog.CatalogItem'
        "304":
          description: Not Modified
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpapi.Problem'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpapi.Problem'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/httpapi.Problem'
      summary: Reviewed movement metadata
      tags:
      - catalog
  /api/v1/catalog/programs:
    get:
      parameters:
      - description: consultation (default) or practice; unknown requirements never
          imply eligibility
        enum:
        - consultation
        - practice
        in: query
        name: mode
        type: string
      - description: Literal title substring, maximum 100 UTF-8 bytes
        in: query
        name: q
        type: string
      - description: Exact source environment; unknown values do not match
        in: query
        name: environment
        type: string
      - description: Exact source population
        in: query
        name: population
        type: string
      - description: Exact source modality
        in: query
        name: modality
        type: string
      - description: Exact source equipment name
        in: query
        name: equipment
        type: string
      - description: Exact source category
        in: query
        name: category
        type: string
      - default: 20
        description: Page size
        in: query
        maximum: 50
        minimum: 1
        name: limit
        type: integer
      - description: Opaque cursor bound to the filters and page size
        in: query
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/catalog.CatalogPage'
        "304":
          description: Not Modified
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpapi.Problem'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/httpapi.Problem'
      summary: List reviewed program and collection metadata
      tags:
      - catalog
  /api/v1/catalog/programs/{id}:
    get:
      parameters:
      - description: Editorial asset ID
        in: path
        name: id
        required: true
        type: string
      - description: Exact SHA-256 version; latest by default
        in: query
        name: versionId
        type: string
      - description: consultation or practice
        enum:
        - consultation
        - practice
        in: query
        name: mode
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/catalog.CatalogItem'
        "304":
          description: Not Modified
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpapi.Problem'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpapi.Problem'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/httpapi.Problem'
      summary: Reviewed program or collection metadata
      tags:
      - catalog
  /api/v1/foods:
    get:
      parameters:
      - description: Literal name substring with collapsed whitespace; reviewed names/aliases
          require locale; maximum 100 UTF-8 bytes
        in: query
        name: q
        type: string
      - description: Optional reviewed-name locale; original fallback. Requires name
          catalog migrations.
        enum:
        - pt-BR
        - pt-PT
        - en
        - es
        in: query
        name: locale
        type: string
      - description: Optional locale revision from nameCatalog; changed revision returns409.
          Cursor retains it automatically.
        in: query
        name: namesVersion
        type: string
      - description: Exact reviewed source ID
        in: query
        name: sourceId
        type: string
      - default: 20
        description: Page size
        in: query
        maximum: 50
        minimum: 1
        name: limit
        type: integer
      - description: Opaque cursor bound to search, source, page size, locale and
          name revision
        in: query
        name: cursor
        type: string
