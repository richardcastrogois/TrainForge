          schema:
            $ref: '#/definitions/catalog.CatalogPage'
        "304":
          description: Not Modified
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpapi.Problem'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/httpapi.Problem'
      summary: List reviewed program and collection metadata
      tags:
      - catalog
  /api/v1/catalog/programs/{id}:
    get:
      parameters:
      - description: Editorial asset ID
        in: path
        name: id
        required: true
        type: string
      - description: Exact SHA-256 version; latest by default
        in: query
        name: versionId
        type: string
      - description: consultation or practice
        enum:
        - consultation
        - practice
        in: query
        name: mode
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/catalog.CatalogItem'
        "304":
          description: Not Modified
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpapi.Problem'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpapi.Problem'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/httpapi.Problem'
      summary: Reviewed program or collection metadata
      tags:
      - catalog
  /api/v1/food-catalog/archive:
    get:
      description: ZIP containing exactly manifest.json and the signed catalog payload.
        Requires an active release and matching archive identity. Transfers use bounded
        memory, at most four concurrent download slots and a 30-minute request deadline;
        supports Range and HEAD. No account authentication is required.
      parameters:
      - description: HTTP byte range, for example bytes=0-1048575
        in: header
        name: Range
        type: string
      - description: ETag or last-modified date for resumable downloads
        in: header
        name: If-Range
        type: string
      - description: Previously received ETag
        in: header
        name: If-None-Match
        type: string
      produces:
      - application/zip
      - application/problem+json
      - text/plain
      responses:
        "200":
          description: Verified catalog update ZIP
          headers:
            ETag:
              description: Quoted SHA-256 of the signed manifest payload
              type: string
          schema:
            type: file
        "206":
          description: Requested ZIP byte range
          headers:
            Content-Range:
              description: Requested byte range and complete archive size
              type: string
            ETag:
              description: Quoted SHA-256 of the signed manifest payload
              type: string
          schema:
            type: file
        "304":
          description: Not Modified
        "416":
          description: HTTP range is not satisfiable
          schema:
            type: string
        "503":
          description: Distribution unavailable, integrity check failed or all download
            slots busy
          schema:
            $ref: '#/definitions/httpapi.Problem'
      summary: Download the signed public food catalog update
      tags:
      - food-catalog
  /api/v1/food-catalog/exports/{artifact}/{file}:
    get:
      description: Artifact is the distributed catalog SHA-256 from the installed
        signed manifest, not the raw SQLite checksum. The archived manifest must match
        this artifact and an active release, verified using the server trust root.
        Only declared source files are served; query parameters are rejected. Supports
        Range and HEAD, four shared download slots and a 30-minute request deadline.
      parameters:
      - description: Lowercase 64-character SHA-256 of the signed distributed catalog
          artifact
        in: path
        maxLength: 64
        minLength: 64
        name: artifact
        required: true
        type: string
      - description: Exact export filename declared by this artifact manifest, ending
          in .jsonl.gz
        in: path
        name: file
        required: true
        type: string
      - description: HTTP byte range
        in: header
        name: Range
        type: string
      - description: ETag or last-modified date for resumable downloads
        in: header
        name: If-Range
        type: string
      - description: Previously received export ETag
        in: header
        name: If-None-Match
        type: string
      produces:
      - application/gzip
      - application/problem+json
      - text/plain
      responses:
        "200":
          description: Verified gzip JSONL source export for the requested artifact
          headers:
            ETag:
              description: Quoted SHA-256 of this source export
              type: string
          schema:
            type: file
        "206":
          description: Requested export byte range
          headers:
            Content-Range:
              description: Requested byte range and complete export size
              type: string
            ETag:
              description: Quoted SHA-256 of this source export
              type: string
          schema:
            type: file
        "304":
          description: Not Modified
        "404":
          description: Artifact is unknown, untrusted, mismatched or inactive, or
            export request is invalid
          schema:
            $ref: '#/definitions/httpapi.Problem'
        "416":
          description: HTTP range is not satisfiable
          schema:
            type: string
        "503":
          description: Source file unavailable, integrity check failed or download
            slots busy
          schema:
            $ref: '#/definitions/httpapi.Problem'
      summary: Download a source export for an exact food catalog artifact
      tags:
      - food-catalog
  /api/v1/food-catalog/exports/{file}:
    get:
      description: Serves only a declared gzip JSONL source after verifying signed
        size, SHA-256 and active release. Query parameters are rejected. Supports
        Range and HEAD, four shared download slots and a 30-minute request deadline.
        Use the artifact-specific route to retain an older catalog source offer.
      parameters:
      - description: Exact export filename declared by the signed manifest, ending
          in .jsonl.gz
        in: path
        name: file
        required: true
        type: string
      - description: HTTP byte range
        in: header
        name: Range
        type: string
      - description: ETag or last-modified date for resumable downloads
        in: header
        name: If-Range
        type: string
      - description: Previously received export ETag
        in: header
        name: If-None-Match
        type: string
      produces:
      - application/gzip
      - application/problem+json
      - text/plain
      responses:
        "200":
          description: Verified gzip JSONL source export
          headers:
            ETag:
              description: Quoted SHA-256 of this source export
              type: string
          schema:
            type: file
        "206":
          description: Requested export byte range
          headers:
            Content-Range:
              description: Requested byte range and complete export size
              type: string
            ETag:
              description: Quoted SHA-256 of this source export
              type: string
          schema:
            type: file
        "304":
          description: Not Modified
        "404":
          description: Export is undeclared, malformed or has query parameters
          schema:
            $ref: '#/definitions/httpapi.Problem'
        "416":
          description: HTTP range is not satisfiable
          schema:
            type: string
        "503":
          description: Current release unavailable, file integrity failed or download
            slots busy
          schema:
            $ref: '#/definitions/httpapi.Problem'
      summary: Download a source export from the current food catalog
      tags:
      - food-catalog
  /api/v1/food-catalog/manifest:
    get:
      description: Public metadata for the exact active distribution. Payload and
        Ed25519 signature are base64 encoded; clients verify against their installed
        trust root. Cached for 300 seconds. No account authentication is required.
      parameters:
      - description: Quoted SHA-256 ETag of the signed manifest payload
        in: header
        name: If-None-Match
        type: string
      produces:
      - application/json
      - application/problem+json
      responses:
        "200":
          description: OK
          headers:
            Cache-Control:
              description: public, max-age=300
              type: string
            ETag:
              description: Quoted SHA-256 of the signed manifest payload
              type: string
          schema:
            $ref: '#/definitions/publiccatalog.SignedManifestEnvelope'
        "304":
          description: Not Modified
          headers:
            Cache-Control:
              description: public, max-age=300
              type: string
            ETag:
              description: Quoted SHA-256 of the signed manifest payload
              type: string
        "503":
          description: Distribution is unconfigured, untrusted or inactive
          schema:
            $ref: '#/definitions/httpapi.Problem'
      summary: Read the signed public food catalog manifest
      tags:
      - food-catalog
  /api/v1/foods:
    get:
      description: Locale-aware search also recognizes bounded everyday-food discovery
        terms. It preserves source identity, preparation, reviewed names and composition.
      parameters:
      - description: Literal name substring plus bounded everyday-food discovery terms
          when locale is supplied; reviewed names/aliases require locale; maximum
          100 UTF-8 bytes
        in: query
        name: q
        type: string
      - description: Optional reviewed-name locale; original fallback. Requires name
          catalog migrations.
        enum:
        - pt-BR
        - pt-PT
        - en
        - es
        in: query
        name: locale
        type: string
      - description: Optional locale revision from nameCatalog; changed revision returns409.
          Cursor retains it automatically.
        in: query
        name: namesVersion
        type: string
      - description: Exact reviewed source ID
        in: query
        name: sourceId
        type: string
      - default: 20
        description: Page size
        in: query
        maximum: 50
        minimum: 1
        name: limit
        type: integer
      - description: Opaque cursor bound to search, source, page size, locale and
          name revision
        in: query
        name: cursor
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/nutrition.FoodPage'
        "304":
          description: Not Modified
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpapi.Problem'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/httpapi.Problem'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/httpapi.Problem'
      summary: Search reviewed food references
      tags:
      - nutrition
  /api/v1/foods/{id}:
    get:
      parameters:
      - description: Source-derived food ID
        in: path
        name: id
        required: true
        type: string
      - description: Exact SHA-256 source version; latest by default
        in: query
        name: versionId
        type: string
      - description: Optional reviewed-name locale; missing/withdrawn translation
          keeps original.
        enum:
        - pt-BR
        - pt-PT
        - en
        - es
        in: query
        name: locale
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/nutrition.FoodDetail'
        "304":
          description: Not Modified
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpapi.Problem'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/httpapi.Problem'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/httpapi.Problem'
      summary: Reviewed food composition and attribution
      tags:
      - nutrition
  /api/v1/foods/filters:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/nutrition.FoodFacets'
        "304":
          description: Not Modified
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/httpapi.Problem'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/httpapi.Problem'
      summary: Reviewed food sources and coverage
      tags:
      - nutrition
  /api/v1/health/live:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/httpapi.Status'
      summary: Process liveness
      tags:
      - operation
  /api/v1/health/ready:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
