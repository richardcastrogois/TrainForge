name: trainforge
description: "A new Flutter project."
publish_to: 'none'
version: 0.5.1+31

environment:
  sdk: ^3.11.1

dependencies:
  dio: ^5.9.2
  flutter_svg: 2.3.0
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: 0.20.2
  flutter_secure_storage: ^10.0.0
  google_sign_in: ^7.2.0
  url_launcher: ^6.3.3
  sqflite: 2.4.2+1
  sqflite_sqlcipher: 3.4.1
  path: 1.9.1
  path_provider: 2.1.6
  crypto: 3.0.8
  mobile_scanner: 7.5.0
  file_picker: 13.4.0
  archive: 4.7.1
  cryptography: 2.9.0
  image_picker: 1.2.4

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  sqflite_common_ffi: 2.4.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/figma/
    - assets/fonts/OFL.txt
    - assets/food_catalog/
    - assets/legal/
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
