name: trainforge
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.6+9

environment:
  sdk: ^3.11.1

dependencies:
  dio: ^5.9.2
  flutter_svg: 2.3.0
  flutter:
    sdk: flutter
  flutter_secure_storage: ^10.0.0
  google_sign_in: ^7.2.0
  url_launcher: ^6.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/figma/
    - assets/fonts/OFL.txt
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
